{% extends "base.html" %}

{% block extrahead %}
  {{ super() }}
  <script>
    // Determine theme based on current page
    function applyTheme() {
      const pathname = window.location.pathname;
      let theme = 'home-theme';

      if (pathname.includes('/redux/')) {
        theme = 'redux-theme';
      } else if (pathname.includes('/galleon')) {
        theme = 'galleon-theme';
      } else if (pathname.includes('/mods/')) {
        theme = 'mods-theme';
      }

      document.body.className = theme;
    }

    // Apply theme on page load
    document.addEventListener('DOMContentLoaded', applyTheme);
    applyTheme();
  </script>
{% endblock %}
